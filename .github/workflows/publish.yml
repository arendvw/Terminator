name: Publish to NuGet.org

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']   # fires on 1.0.23-style release tags

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # required for OIDC Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # MinVer needs full history + tags to derive the version

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: |
          dotnet pack src/Terminator.csproj -c Release -o artifacts
          dotnet pack template/Terminator.Templates.csproj -c Release -o artifacts

      - name: NuGet login (OIDC -> short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: avanwaart   # nuget.org profile name (not an email)

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
